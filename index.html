<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="PWA de Participación Ciudadana para reportar problemas urbanos">
    <title>Reporte Ciudadano</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="offline-banner" class="offline-banner" hidden>Modo Offline</div>

    <main class="container">
        <header class="header">
            <h1>Nuevo Reporte</h1>
        </header>

        <form id="report-form" class="report-form" novalidate>
            <div class="form-group">
                <label for="photo-input" class="photo-label">
                    <img id="photo-preview" class="photo-preview" alt="Vista previa de la foto" hidden>
                    <span class="photo-placeholder">Toca para tomar foto</span>
                </label>
                <input
                    type="file"
                    id="photo-input"
                    name="photo"
                    accept="image/*"
                    capture="environment"
                    class="photo-input"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Descripción</label>
                <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="Describe el problema..."
                    required
                    maxlength="500"
                >
            </div>

            <div class="form-group">
                <label for="category">Categoría</label>
                <select id="category" name="category" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="bache">Bache</option>
                    <option value="luminaria">Luminaria</option>
                    <option value="basura">Basura</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Guardar Reporte</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
